<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>DocBox</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
    <a href="{{ url_for('index') }}">Загрузка</a>
    <a href="{{ url_for('documents_list') }}">Список документов</a>
</nav>
  <h1>DocBox — загрузка документа</h1>
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<p class="flash">{{ m }}</p>{% endfor %}
  {% endwith %}
  <form action="{{ url_for('upload') }}"
          method="post"
          enctype="multipart/form-data">

        <input type="file" name="file" required>
        <button type="submit">Загрузить</button>
    </form>
  <p class="hint">Допустимые форматы: pdf, txt, md, docx, jpg, jpeg, png, gif</p>
</body>
</html>
